name: Site check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC) にリンク切れを定期チェック
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  html-validate:
    name: HTML構文チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: docs/

  link-check:
    name: リンク切れチェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --exclude-mail
            --exclude 'https://open\.spotify\.com'
            --exclude 'https://podcasts\.apple\.com'
            --exclude 'https://music\.amazon\.co\.jp'
            --exclude 'https://x\.com'
            --exclude 'https://toolbox\.marketingtools\.apple\.com'
            --exclude 'https://static\.cloudflareinsights\.com'
            'docs/**/*.html'
          fail: true
